services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: benzo
      POSTGRES_USER: benzo
      POSTGRES_PASSWORD: benzo_password
    ports:
      - "5432:5432"
    volumes:
      - benzo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benzo -d benzo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - benzo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev"]
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  benzo_postgres:
  benzo_redis:
