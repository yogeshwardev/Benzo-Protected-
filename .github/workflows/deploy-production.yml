name: Deploy production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.EC2_APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml pull livekit nginx postgres redis
            docker compose -f docker-compose.prod.yml build api web
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy --schema prisma/schema.prisma
            docker compose -f docker-compose.prod.yml ps
            curl --fail --silent --show-error https://benzo.co.in/api/v1/health/ready
            curl --fail --silent --show-error https://live.benzo.co.in
