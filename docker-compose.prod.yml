services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benzo}
      POSTGRES_USER: ${POSTGRES_USER:-benzo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - benzo_postgres:/var/lib/postgresql/data
    networks:
      - benzo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benzo} -d ${POSTGRES_DB:-benzo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - benzo_redis:/data
    networks:
      - benzo_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${LIVEKIT_LOG_LEVEL:-info}
        rtc:
          tcp_port: 7881
          port_range_start: ${LIVEKIT_RTC_PORT_START:-50000}
          port_range_end: ${LIVEKIT_RTC_PORT_END:-50100}
          use_external_ip: true
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
        webhook:
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-https://benzo.co.in/api/v1/livekit/webhook}
          api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
        turn:
          enabled: false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - benzo_internal
    expose:
      - "7880"
    ports:
      - "7881:7881/tcp"
      - "${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-50100}:${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-50100}/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - benzo_internal
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - benzo_internal
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      livekit:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/benzo.conf:/etc/nginx/conf.d/benzo.conf:ro
      - benzo_certbot_www:/var/www/certbot
      - benzo_letsencrypt:/etc/letsencrypt:ro
    networks:
      - benzo_internal

networks:
  benzo_internal:
    driver: bridge

volumes:
  benzo_postgres:
  benzo_redis:
  benzo_certbot_www:
  benzo_letsencrypt:
