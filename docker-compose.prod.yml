services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benzo}
      POSTGRES_USER: ${POSTGRES_USER:-benzo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - benzo_postgres:/var/lib/postgresql/data
    networks:
      - benzo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benzo} -d ${POSTGRES_DB:-benzo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - benzo_redis:/data
    networks:
      - benzo_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - benzo_internal
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - benzo_internal
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/benzo.conf:/etc/nginx/conf.d/benzo.conf:ro
      - benzo_certbot_www:/var/www/certbot
      - benzo_letsencrypt:/etc/letsencrypt:ro
    networks:
      - benzo_internal

networks:
  benzo_internal:
    driver: bridge

volumes:
  benzo_postgres:
  benzo_redis:
  benzo_certbot_www:
  benzo_letsencrypt:
